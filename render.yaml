databases:
  - name: anti-porozhnyak-db
    plan: free
    databaseName: porozhnyak
    user: porozhnyak

services:
  - type: web
    name: anti-porozhnyak-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: anti-porozhnyak-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
